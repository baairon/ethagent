    <tspan x="8" dy="17">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;*@-+@@@@@:&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;%@@+&#160;&#160;@@@=#@</tspan>
    <tspan x="8" dy="17">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;*@=&#160;&#160;&#160;@@@@@@@-&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;.@.@@@@@@@&#160;:</tspan>
    <tspan x="8" dy="17">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;@@+=@@@@@@@@@@@@:&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;.%&#160;*@@@@@*-=</tspan>
    <tspan x="8" dy="17">&#160;&#160;&#160;&#160;&#160;&#160;&#160;#:-@&#160;-@@@@@@@@@-+%&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;@&#160;&#160;-@@@-&#160;#</tspan>
    <tspan x="8" dy="17">&#160;&#160;&#160;&#160;&#160;&#160;&#160;:&#160;&#160;#+&#160;&#160;@@@@@@@-&#160;-%&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;=#&#160;&#160;&#160;&#160;&#160;=</tspan>
    <tspan x="8" dy="17">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;-@:&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;*@&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;.+%%</tspan>
    <tspan x="8" dy="17">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;:%#:&#160;--</tspan>
    <tspan x="8" dy="17">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;.-:</tspan>
    <tspan x="8" dy="34">╔═════════════════════════════════════════════════════════════════════╗</tspan>
    <tspan x="8" dy="17">║░░░░░░░╗░░░░░░░░╗░░╗&#160;&#160;░░╗&#160;█████╗&#160;&#160;██████╗&#160;███████╗███╗&#160;&#160;&#160;██╗████████╗║</tspan>
    <tspan x="8" dy="17">║░░╔════╝╚══░░╔══╝░░║&#160;&#160;░░║██╔══██╗██╔════╝&#160;██╔════╝████╗&#160;&#160;██║╚══██╔══╝║</tspan>
    <tspan x="8" dy="17">║░░░░░╗&#160;&#160;&#160;&#160;&#160;░░║&#160;&#160;&#160;░░░░░░░║███████║██║&#160;&#160;███╗█████╗&#160;&#160;██╔██╗&#160;██║&#160;&#160;&#160;██║&#160;&#160;&#160;║</tspan>
    <tspan x="8" dy="17">║░░╔══╝&#160;&#160;&#160;&#160;&#160;░░║&#160;&#160;&#160;░░╔══░░║██╔══██║██║&#160;&#160;&#160;██║██╔══╝&#160;&#160;██║╚██╗██║&#160;&#160;&#160;██║&#160;&#160;&#160;║</tspan>
    <tspan x="8" dy="17">║░░░░░░░╗&#160;&#160;&#160;░░║&#160;&#160;&#160;░░║&#160;&#160;░░║██║&#160;&#160;██║╚██████╔╝███████╗██║&#160;╚████║&#160;&#160;&#160;██║&#160;&#160;&#160;║</tspan>
    <tspan x="8" dy="17">║╚══════╝&#160;&#160;&#160;╚═╝&#160;&#160;&#160;╚═╝&#160;&#160;╚═╝╚═╝&#160;&#160;╚═╝&#160;╚═════╝&#160;╚══════╝╚═╝&#160;&#160;╚═══╝&#160;&#160;&#160;╚═╝&#160;&#160;&#160;║</tspan>
    <tspan x="8" dy="17">╚═════════════════════════════════════════════════════════════════════╝</tspan>
